<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="选十：为小型团队设计的极简共同选片原型。" />
    <meta property="og:title" content="选十 · 共同选片" />
    <meta property="og:description" content="独立打星，共同终选十张。" />
    <title>选十 · 共同选片</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">跳到主要内容</a>
    <header class="app-header">
      <button class="brand" type="button" data-action="home" aria-label="返回创建页">
        <svg class="brand-mark" viewBox="0 0 36 36" role="img" aria-label="选十">
          <path d="M6.5 6.5h23v23h-23z" />
          <path d="M12 12h5v12h-5M22 12v12M19.5 14.5 22 12l2.5 2.5" />
        </svg>
        <span class="brand-name">选十</span>
      </button>
      <ol class="steps" aria-label="选片流程">
        <li data-step="setup"><span>01</span> 创建</li>
        <li data-step="rating"><span>02</span> 独立评分</li>
        <li data-step="final"><span>03</span> 终选十张</li>
      </ol>
      <button class="icon-button" type="button" data-action="theme" aria-label="切换明暗模式">
        <svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42" />
        </svg>
      </button>
    </header>

    <main id="main" tabindex="-1"></main>

    <div class="lightbox" data-lightbox hidden>
      <button class="lightbox-close" type="button" data-action="close-lightbox" aria-label="关闭大图">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 5 14 14M19 5 5 19" /></svg>
      </button>
      <button class="lightbox-zoom" type="button" data-action="toggle-zoom" aria-label="查看原图尺寸">1:1</button>
      <button class="lightbox-nav lightbox-prev" type="button" data-action="previous-photo" aria-label="上一张">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 4-8 8 8 8" /></svg>
      </button>
      <figure class="lightbox-stage">
        <button class="lightbox-image" type="button" data-action="toggle-zoom" aria-label="放大至原图尺寸">
          <img data-lightbox-image src="" alt="" />
        </button>
        <figcaption data-lightbox-caption></figcaption>
      </figure>
      <button class="lightbox-nav lightbox-next" type="button" data-action="next-photo" aria-label="下一张">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 4 8 8-8 8" /></svg>
      </button>
      <div class="lightbox-rating" data-lightbox-rating></div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
